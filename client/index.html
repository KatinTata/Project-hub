<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Project Insight Hub" />
    <title>Intelisale Project Insight Hub</title>
    <style>
      /* Hanken Grotesk se servira SA NAŠEG domena (client/public/fonts, OFL
         licenca). Ranije je stizao samo sa Google CDN-a — kad ga mreža/firewall
         blokira ili kasni, tekst je padao na podrazumevani serif (Times).
         `font-display: swap` + sans-serif fallback znače da najgori slučaj sada
         izgleda kao Arial, nikad kao Times. */
      @font-face {
        font-family: 'Hanken Grotesk';
        src: url('/fonts/HankenGrotesk-Regular.ttf') format('truetype');
        font-weight: 400 500; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'Hanken Grotesk';
        src: url('/fonts/HankenGrotesk-SemiBold.ttf') format('truetype');
        font-weight: 600; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'Hanken Grotesk';
        src: url('/fonts/HankenGrotesk-Bold.ttf') format('truetype');
        font-weight: 700; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: 'Hanken Grotesk';
        src: url('/fonts/HankenGrotesk-ExtraBold.ttf') format('truetype');
        font-weight: 800 900; font-style: normal; font-display: swap;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; transition: background 0.3s, color 0.3s; }
      * { transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
      a { color: inherit; text-decoration: none; }
      button { cursor: pointer; border: none; background: none; font-family: inherit; }
      input, textarea, select { font-family: inherit; outline: none; }
      /* P2-C1: vidljiv fokus za tastaturnu navigaciju. !important namerno —
         pobedjuje rasuti inline outline:none; misem fokusirani elementi
         (:focus bez :focus-visible) ostaju bez prstena. */
      :focus-visible { outline: 2px solid var(--accent) !important; outline-offset: 2px; }
      /* P2-C7: globalno poštuj reduced-motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      .glass-card {
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      @keyframes page-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }
      .page-in { animation: page-in 0.25s ease; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
